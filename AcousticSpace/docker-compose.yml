# ==========================================
# AcousticSpace - Docker Compose Configuration
# ==========================================

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: acousticspace-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Application
      - APP_NAME=AcousticSpace API
      - APP_VERSION=1.0.0
      
      # Server
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      
      # Paths (inside container)
      - UPLOAD_DIR=/app/uploads
      - FEATURE_DIR=/app/extracted_features
      - MODEL_DIR=/app/saved_models
      - LOG_DIR=/app/logs
      
      # AST Model Path - points to mounted volume
      - AST_MODEL_PATH=/app/results/ast_final_model
      
      # Database
      - DATABASE_URL=sqlite:///app/data/acousticspace.db
      
      # File Upload
      - MAX_UPLOAD_SIZE=52428800
      - ALLOWED_EXTENSIONS=.wav,.mp3,.flac,.ogg,.m4a
      
      # Security (CHANGE THIS IN PRODUCTION!)
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      
      # CORS
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Uploaded audio files
      - uploads:/app/uploads
      
      # Extracted features
      - extracted_features:/app/extracted_features
      
      # Saved models
      - saved_models:/app/saved_models
      
      # Logs
      - logs:/app/logs
      
      # Database persistence
      - database:/app/data
      
      # AST Model - mount from host or use named volume
      # Option A: Mount from host directory (if model exists locally)
      # - ./results/ast_final_model:/app/results/ast_final_model
      
      # Option B: Use named volume for model (model will be copied during build)
      - results:/app/results
      
      # Optional: Mount additional models directory
      # - ./models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
      start_interval: 5s
    networks:
      - acousticspace-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

volumes:
  # Persistent volumes for data
  uploads:
    name: acousticspace-uploads
  extracted_features:
    name: acousticspace-extracted-features
  saved_models:
    name: acousticspace-saved-models
  logs:
    name: acousticspace-logs
  database:
    name: acousticspace-database
  results:
    name: acousticspace-results

networks:
  acousticspace-network:
    name: acousticspace-network
    driver: bridge